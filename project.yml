name: CalendarTest
options:
  bundleIdPrefix: me.evanollivier.test
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "CalendarTest needs calendar access to add, update and cancel your flight event."
    INFOPLIST_KEY_NSCalendarsUsageDescription: "CalendarTest needs calendar access to add, update and cancel your flight event."
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ENABLE_PREVIEWS: YES
targets:
  CalendarTest:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.evanollivier.test.CalendarTest
        TARGETED_DEVICE_FAMILY: "1,2"
